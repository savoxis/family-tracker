<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2EEE6">
<title>Kitchen Board</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/fonts.css">
</head>
<body>
<style>
/* Kitchen Board look. One 16:9 wall screen: on a landscape display the whole page scales as a unit (rem tracks the screen), so it looks the same on a 1080p monitor and a 1440x810 Android desktop window. Warm paper in light, deep navy in dark. Member colors and the star are the only saturated things. */
:root{
  --bg:#F2EEE6; --panel:#FFFFFF; --panel2:#F7F4EE; --ink:#1B2230; --ink2:#5E6676; --line:#E3DDD1;
  --accent:#3552D6; --accent-ink:#FFFFFF;
  --star:#F0A500; --star-soft:#FFF1CB; --star-ink:#6B4500;
  --ok:#1E8A5A; --bad:#C23A2B; --scrim:rgba(16,20,28,.58);
  --shadow:0 1px 2px rgba(27,34,48,.06),0 8px 24px rgba(27,34,48,.07);
  --f-display:"Fredoka","Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1117; --panel:#161C26; --panel2:#1B2230; --ink:#EEF1F6; --ink2:#9BA5B6; --line:#262F3E;
    --accent:#86A2FF; --accent-ink:#0B1220;
    --star:#FFC53D; --star-soft:#3A2E10; --star-ink:#FFD879;
    --ok:#4CC38A; --bad:#FF7A6B; --scrim:rgba(0,0,0,.65);
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1117; --panel:#161C26; --panel2:#1B2230; --ink:#EEF1F6; --ink2:#9BA5B6; --line:#262F3E;
  --accent:#86A2FF; --accent-ink:#0B1220;
  --star:#FFC53D; --star-soft:#3A2E10; --star-ink:#FFD879;
  --ok:#4CC38A; --bad:#FF7A6B; --scrim:rgba(0,0,0,.65);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
html{font-size:calc(clamp(14px,0.5vw + 8.5px,20px) * var(--z,1));height:100%;overscroll-behavior:none}
@media (min-width:760px) and (min-height:400px) and (min-aspect-ratio:4/3){
  html{font-size:calc(min(0.8334vw,1.4815vh) * var(--z,1))}
}
body{
  height:100%;margin:0;display:flex;flex-direction:column;gap:1.1rem;
  padding-block:1.3rem 1.4rem;
  padding-left:max(1.8rem,env(safe-area-inset-left,0px));
  padding-right:max(1.8rem,env(safe-area-inset-right,0px));
  background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.35;
  -webkit-tap-highlight-color:transparent;overflow:hidden;
}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ic{width:1.25em;height:1.25em;fill:currentColor;flex:none;vertical-align:-.22em}
.ic.s{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.star{color:var(--star)}
body, .top, main, .panel, .btn, .chore, .ev{-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}

/* header */
.top{display:flex;align-items:center;gap:1.1rem;flex:none}
.clockbox{display:flex;align-items:baseline;gap:1.2rem}
.clock{font-family:var(--f-display);font-weight:600;font-size:4.6rem;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:.4rem}
.clock small{font-size:1.5rem;font-weight:600;color:var(--ink2);letter-spacing:0}
.date{font-size:1.55rem;font-weight:600;color:var(--ink2)}
.top .grow{flex:1}
.tonight{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:.05rem;min-height:3.8rem;max-width:26rem;border:0;border-radius:1rem;padding:.45rem 1.2rem;margin-left:1rem;text-align:left;background:color-mix(in srgb,var(--star) 18%,var(--panel));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--star) 35%,transparent)}
.tonight small{font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--star-ink)}
.tonight b{font-family:var(--f-display);font-weight:600;font-size:1.5rem;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tonight b.dim{color:var(--ink2);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;min-height:3.6rem;padding:.5rem 1.2rem;border-radius:1rem;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:1.1rem;box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.sm{min-height:2.9rem;padding:.3rem .95rem;font-size:1rem;box-shadow:none}
.btn.danger{color:var(--bad)}
.btn.danger.arm{background:var(--bad);color:#fff;border-color:transparent}
.btn[disabled]{opacity:.45;cursor:default}
.gear{position:relative;overflow:hidden;width:3.6rem;padding:0}
.gear::after{content:"";position:absolute;left:0;right:0;bottom:0;height:.3rem;background:var(--accent);transform:scaleX(0);transform-origin:left}
.gear.holding::after{animation:hold .65s linear forwards}
@keyframes hold{to{transform:scaleX(1)}}
.notice{flex:none;background:var(--star-soft);color:var(--star-ink);border-radius:.8rem;padding:.55rem 1rem;font-weight:600}
.cnt{display:inline-grid;place-items:center;min-width:1.7rem;height:1.7rem;padding:0 .45rem;border-radius:1rem;background:var(--accent);color:var(--accent-ink);font-size:1rem;font-family:var(--f-display)}

/* board */
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 27rem;gap:1.3rem}
.side{display:flex;flex-direction:column;gap:1rem;min-height:0;overflow:auto;padding:.15rem}
.sc{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:1.4rem;box-shadow:var(--shadow);padding:.9rem 1rem 1rem;display:flex;flex-direction:column;gap:.5rem;min-width:0}
.sc-h{display:flex;align-items:center;gap:.6rem}
.sc-h h3{margin:0;flex:1;font-family:var(--f-display);font-weight:600;font-size:1.5rem}
.sc-h .btn{min-height:2.7rem;padding:.2rem .9rem;font-size:1rem}
.sc small.k{display:block;font-size:.75rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--star-ink)}
.sc .ln{display:flex;gap:.6rem;align-items:baseline;text-align:left;border:0;background:none;padding:.15rem 0;font-size:1.1rem;font-weight:600;min-width:0;width:100%}
.sc .ln .t{flex:none;min-width:4.4rem;font-size:.9rem;font-weight:700;color:var(--ink2)}
.sc .ln .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc .ln i{flex:none;width:.6rem;height:.6rem;border-radius:50%;background:var(--c);align-self:center}
.sc .none{margin:0;color:var(--ink2);font-weight:600}
.dn{display:block;width:100%;text-align:left;border:0;border-radius:1rem;padding:.55rem .8rem;background:color-mix(in srgb,var(--star) 14%,var(--panel));min-width:0}
.dn b{display:block;font-family:var(--f-display);font-weight:600;font-size:1.6rem;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dn b.dim{color:var(--ink2);font-weight:500;font-size:1.25rem}
.dn.sm b{font-size:1.2rem}
.gl{display:flex;flex-wrap:wrap;gap:.4rem}
.gl span{background:var(--panel2);border-radius:2rem;padding:.25rem .8rem;font-weight:600;font-size:1.05rem}
.tonight{display:none!important}
#cal{display:none}
body.calopen #cal{display:flex;position:fixed;inset:max(.8rem,env(safe-area-inset-top,0px)) max(.8rem,env(safe-area-inset-right,0px)) max(.8rem,env(safe-area-inset-bottom,0px)) max(.8rem,env(safe-area-inset-left,0px));z-index:40;overflow:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:1.5rem;box-shadow:var(--shadow);min-height:0;min-width:0}
.cal{display:flex;flex-direction:column;padding:1.2rem 1.2rem 1rem}
.cal-head{display:flex;align-items:center;gap:.7rem;margin-bottom:1rem}
.cal-head h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:2rem;flex:1;min-width:0;display:flex;align-items:baseline;gap:.8rem}
.cal-head h2 small{font-family:var(--f-body);font-size:1.05rem;font-weight:600;color:var(--ink2)}
.nav{width:3.6rem;padding:0}
.week{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.6rem;align-items:stretch}
.day{background:var(--panel2);border-radius:1.1rem;padding:.7rem .6rem .6rem;display:flex;flex-direction:column;gap:.55rem;min-width:0;min-height:0}
.day.today{background:color-mix(in srgb,var(--accent) 9%,var(--panel));box-shadow:inset 0 0 0 2px var(--accent)}
.day.past .evs{opacity:.7}
.day > header{display:flex;align-items:flex-start;justify-content:space-between;gap:.3rem}
.dh{display:flex;flex-direction:column;align-items:flex-start;gap:.05rem;min-width:0}
.dow{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);white-space:nowrap}
.day.today .dow{color:var(--accent)}
.dnum{font-family:var(--f-display);font-weight:600;font-size:2.3rem;line-height:1;font-variant-numeric:tabular-nums}
.addev{flex:none;width:2.7rem;height:2.7rem;border-radius:50%;border:0;background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink2);font-weight:700;font-size:1.6rem;line-height:1;display:grid;place-items:center;padding:0}
.addev:active{background:color-mix(in srgb,var(--accent) 25%,transparent)}
.sbs{display:flex;flex-wrap:wrap;gap:.1rem}
.sb{position:relative;width:2.7rem;height:2.7rem;display:grid;place-items:center;color:var(--mc)}
.sb .ic{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.28))}
.sb b{position:relative;font-family:var(--f-display);font-weight:700;font-size:1.2rem;color:#fff;margin-top:.14rem;line-height:1}
.evs{flex:1 1 auto;display:flex;flex-direction:column;gap:.45rem;min-height:0;overflow:hidden}
.none{margin:.2rem 0 0;color:var(--ink2);font-size:.9rem;opacity:.6}
.ev{display:block;width:100%;text-align:left;border:0;border-radius:.75rem;padding:.5rem .6rem .55rem .85rem;background:var(--panel);background:color-mix(in srgb,var(--c) 15%,var(--panel));box-shadow:inset .3rem 0 0 var(--c);color:var(--ink);min-height:3.2rem;overflow-wrap:anywhere}
.ev.all{background:color-mix(in srgb,var(--c) 30%,var(--panel));font-weight:700}
.ev-t{display:block;font-size:.85rem;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.ev-n{display:block;font-size:1.08rem;font-weight:600;line-height:1.2}
.rp{margin-left:.35rem;color:var(--ink2);font-weight:700}
.meal{display:block;width:100%;min-height:3.2rem;border:0;border-radius:.75rem;padding:.4rem .6rem;text-align:left;background:color-mix(in srgb,var(--star) 17%,var(--panel));color:var(--ink);overflow-wrap:anywhere;font-weight:600;font-size:1.02rem;line-height:1.2}
.meal small{display:block;font-size:.72rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--star-ink)}
.meal.empty-m{background:none;color:var(--ink2);opacity:.75;font-weight:600;text-align:left;box-shadow:inset 0 1px 0 var(--line);border-radius:0;padding-top:.7rem}
.legend{display:flex;flex-wrap:wrap;gap:.3rem 1.2rem;margin-top:.8rem;font-size:.95rem;color:var(--ink2);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:.4rem}
.legend i{width:.8rem;height:.8rem;border-radius:50%;background:var(--c)}
.calmsg{flex:1;display:grid;place-content:center;gap:.8rem;text-align:center;padding:1rem;color:var(--ink2);font-size:1.2rem}
.calmsg b{color:var(--ink)}

/* chores */
.chores{display:grid;grid-template-rows:minmax(0,1fr);grid-auto-rows:auto;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:1rem;align-content:stretch;overflow:auto;padding:.15rem;min-height:0}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:1.5rem;box-shadow:var(--shadow);padding:1rem 1rem 1.1rem;display:flex;flex-direction:column;gap:.75rem;min-width:0;min-height:0}
.card::before{content:"";position:absolute;left:1.2rem;right:1.2rem;top:0;height:.35rem;border-radius:0 0 .4rem .4rem;background:var(--mc)}
.spk{flex:none;width:3.4rem;height:3.4rem;border-radius:50%;border:2px solid var(--line);background:var(--panel);font-size:1.6rem;line-height:1;display:grid;place-items:center;padding:0}
.spk:active{background:var(--star-soft)}
.card-h{display:flex;align-items:center;gap:.85rem;padding-top:.3rem}
.ring{flex:none;width:4.4rem;height:4.4rem;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--mc) calc(var(--p) * 1%), color-mix(in srgb,var(--mc) 18%,var(--panel2)) 0)}
.ring .av{width:3.5rem;height:3.5rem;box-shadow:0 0 0 .25rem var(--panel)}
.av{flex:none;width:3.6rem;height:3.6rem;border-radius:50%;background:var(--mc);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:1.8rem}
.av.sm{width:2.3rem;height:2.3rem;font-size:1.15rem}
.who{min-width:0;flex:1}
.who h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:1.9rem;line-height:1.05;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who p{margin:.15rem 0 0;color:var(--ink2);font-weight:600;font-size:1rem}
.who p.st{display:flex;flex-wrap:wrap;align-items:center;gap:.1rem .8rem;color:var(--star-ink);font-size:.95rem;margin-top:.05rem}
.who p.st span{white-space:nowrap}
.bal{display:inline-flex;align-items:center;gap:.3rem;background:var(--star-soft);color:var(--star-ink);border-radius:2rem;padding:.3rem .8rem;font-family:var(--f-display);font-weight:600;font-size:1.4rem;font-variant-numeric:tabular-nums}
.bar{display:none}
.list{display:flex;flex-direction:column;gap:.55rem;min-height:0;flex:1}
.list .chore{flex:1 1 auto;max-height:6.4rem}
.chore{position:relative;display:flex;align-items:center;gap:.85rem;width:100%;min-height:4.7rem;text-align:left;padding:.5rem .9rem .5rem .7rem;border-radius:1.1rem;border:2px solid var(--line);background:var(--panel)}
.box{flex:none;width:2.9rem;height:2.9rem;border-radius:50%;border:3px solid var(--mc);display:grid;place-items:center;color:transparent}
.box .ic{width:1.6rem;height:1.6rem}
.ct{flex:1;min-width:0;font-size:1.35rem;font-weight:600;line-height:1.15}
.ct small{display:block;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.cs{flex:none;display:inline-flex;align-items:center;gap:.2rem;font-family:var(--f-display);font-weight:600;font-size:1.25rem;color:var(--star-ink);background:var(--star-soft);border-radius:2rem;padding:.15rem .65rem}
.chore.done{background:color-mix(in srgb,var(--mc) 13%,var(--panel));border-color:var(--mc)}
.chore.done .box{background:var(--mc);color:#fff}
.chore.done .ct{text-decoration:line-through;text-decoration-thickness:2px;color:var(--ink2)}
.plus{position:absolute;right:1rem;top:-.2rem;font-family:var(--f-display);font-weight:700;font-size:1.6rem;color:var(--star);pointer-events:none;animation:rise .9s ease-out forwards}
@keyframes rise{from{opacity:1;transform:translateY(.6rem) scale(.8)}to{opacity:0;transform:translateY(-1.6rem) scale(1.15)}}
.tag{display:inline-flex;align-items:center;gap:.3rem;font-weight:700;color:var(--ok);font-size:1rem}
.empty{display:grid;gap:.8rem;place-content:center;text-align:center;padding:2rem 1rem;color:var(--ink2);font-size:1.15rem}
.empty h3{margin:0;font-family:var(--f-display);font-size:1.8rem;color:var(--ink)}
.nochores{color:var(--ink2);padding:.4rem .2rem;font-weight:500}
.cel{position:absolute;inset:0;border-radius:1.5rem;overflow:hidden;display:grid;place-items:center;background:color-mix(in srgb,var(--panel) 94%,transparent);z-index:5;pointer-events:none;animation:celin 3.6s ease forwards}
.cel-i{display:grid;justify-items:center;gap:.2rem;text-align:center}
.cel-i .big{width:6rem;height:6rem;color:var(--star);animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
.cel-i .big .ic{width:100%;height:100%}
.cel-i b{font-family:var(--f-display);font-size:2.1rem}
.cel-i small{font-weight:700;color:var(--ink2);font-size:1.05rem}
.cel i{position:absolute;top:-1rem;width:.65rem;height:1.1rem;border-radius:.15rem;background:var(--mc);animation:fall 1.6s ease-in infinite}
@keyframes celin{0%{opacity:0}8%{opacity:1}85%{opacity:1}100%{opacity:0}}
@keyframes pop{from{transform:scale(.2) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
@keyframes fall{to{transform:translateY(30rem) rotate(540deg)}}

/* overlays */
#scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:max(1rem,env(safe-area-inset-top,0px)) max(1rem,env(safe-area-inset-right,0px)) max(1rem,env(safe-area-inset-bottom,0px)) max(1rem,env(safe-area-inset-left,0px));z-index:50}
#sheet{width:min(66rem,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:1.6rem;box-shadow:var(--shadow);padding:1.3rem 1.4rem 1.5rem}
#sheet.small{width:min(34rem,100%)}
.sh{display:flex;align-items:center;gap:.8rem;margin-bottom:1rem}
.sh h2{margin:0;flex:1;font-family:var(--f-display);font-weight:600;font-size:2.1rem}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.tabs .btn{box-shadow:none}
.tabs .btn[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:transparent}
.rows{display:grid;gap:.6rem;margin-bottom:1rem}
.row{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;background:var(--panel2);border-radius:1rem;padding:.65rem .75rem}
.row .grow{flex:1;min-width:8rem}
.inp{min-height:3.2rem;border-radius:.8rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:.4rem .85rem;font:inherit;font-size:1.1rem;min-width:0}
.inp.num{width:6.5rem}
.addrow{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.addrow .inp{flex:1;min-width:12rem}
.sw{display:flex;gap:.3rem}
.swatch{width:2.4rem;height:2.4rem;border-radius:50%;border:3px solid transparent;background:var(--sw);padding:0}
.swatch.on{border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:.2rem 0 1rem}
.chip{min-height:3rem;padding:.3rem 1rem;border-radius:2rem;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:1.05rem}
.chip.on{background:var(--mc,var(--accent));color:#fff;border-color:transparent}
.chip.day{width:3rem;padding:0;text-align:center}
.chip.star-on{background:var(--star-soft);border-color:var(--star);color:var(--star-ink)}
.hint{color:var(--ink2);margin:.2rem 0 .8rem;font-size:1.02rem}
.lbl{font-size:.85rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);margin:.2rem 0 .3rem;display:block}
.ed{flex-basis:100%;display:grid;gap:.5rem;padding-top:.4rem}
.chead{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;background:none;border:0;padding:0;min-height:2.8rem}
.chead b{flex:1;font-size:1.2rem}
.chead span{color:var(--ink2);font-size:1rem}
.whos{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.pick{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}
.pick .chip{display:inline-flex;align-items:center;gap:.5rem;padding:.3rem 1rem .3rem .35rem;font-size:1.15rem}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(16rem,1fr));gap:.8rem}
.rw{display:flex;flex-direction:column;gap:.6rem;border:2px solid var(--line);border-radius:1.1rem;padding:1rem;background:var(--panel)}
.rw h4{margin:0;font-size:1.3rem;line-height:1.2;overflow-wrap:anywhere}
.rw .cost{display:inline-flex;align-items:center;gap:.3rem;font-family:var(--f-display);font-weight:600;font-size:1.5rem;color:var(--star-ink)}
.rw .acts{display:flex;gap:.5rem;margin-top:auto}
.rw .acts .btn{flex:1}

/* ---------- storage: shared db when available, otherwise this browser only ---------- */
function localStore(){
  var data = {};
  try { data = JSON.parse(localStorage.getItem('kitchen-board:v1') || '{}') || {}; } catch(e){ data = {}; }
  var listeners = {};
  function list(c){ return Object.keys(data[c]||{}).map(function(id){ var o = clone(data[c][id]); o.id = id; return o; }); }
  function emit(c){ (listeners[c]||[]).forEach(function(f){ f(list(c)); }); }
  function persist(){ try { localStorage.setItem('kitchen-board:v1', JSON.stringify(data)); } catch(e){} }
  return {
    kind:'local',
    subscribe:function(c, cb){ (listeners[c] = listeners[c]||[]).push(cb); Promise.resolve().then(function(){ cb(list(c)); }); return function(){}; },
    set:function(c, id, v){ (data[c] = data[c]||{})[id] = clone(v); persist(); emit(c); return Promise.resolve(); },
    del:function(c, id){ if(data[c]) delete data[c][id]; persist(); emit(c); return Promise.resolve(); }
  };
}
function dbStore(d){
  var q = new Map();
  function run(k, fn){ var p = (q.get(k)||Promise.resolve()).catch(function(){}).then(fn); q.set(k, p); return p; }
  function fail(e){ toast(e && e.code === 'quota_exceeded' ? 'Storage is full. Delete something old.' : 'Could not save that. Try again.'); }
  return {
    kind:'db',
    subscribe:function(c, cb){
      return d.collection(c).onSnapshot(function(s){
        cb(s.docs.map(function(x){ var o = clone(x.data()||{}); o.id = x.id; return o; }));
      }, function(e){ S.dberr = (e && e.code) || 'error'; renderAll(); });
    },
    set:function(c, id, v){ return run(c+'/'+id, function(){ return d.doc(c+'/'+id).set(clone(v)); }).catch(fail); },
    del:function(c, id){ return run(c+'/'+id, function(){ return d.doc(c+'/'+id).delete(); }).catch(fail); }
  };
}

/* ---------- chores + stars ---------- */
function onDuty(c, mid, d){
  var ids = (c.memberIds||[]).slice().sort();
  if(!c.rot || ids.length < 2) return true;
  var days = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);
  var idx = c.rot === 'week' ? Math.floor((days + 3) / 7) : days;
  return ids[idx % ids.length] === mid;
}
function applies(c, d, mid){
  if(mid && !onDuty(c, mid, d)) return false;
  if(c.weekly) return true;
  var days = c.days;
  if(!days || !days.length) return true;
  return days.indexOf(d.getDay()) > -1;
}
function period(c, d){ return c.weekly ? 'W'+dkey(weekStart(d)) : dkey(d); }
function rebuildIdx(){
  var done = new Map(), bal = {}, pend = new Map();
  S.ledger.forEach(function(doc){
    var m = doc.memberId; if(!m) return;
    bal[m] = bal[m] || 0;
    Object.keys(doc.done||{}).forEach(function(k){
      var v = doc.done[k];
      if(v > 0){ done.set(m+'|'+k, {docId:doc.id, stars:v}); bal[m] += v; }
    });
    Object.keys(doc.spent||{}).forEach(function(k){ bal[m] -= (doc.spent[k].cost || 0); });
    Object.keys(doc.pend||{}).forEach(function(k){ var v = doc.pend[k]; if(v > 0 && !done.has(m+'|'+k)) pend.set(m+'|'+k, {docId:doc.id, stars:v, mid:m, key:k}); });
  });
  pend.forEach(function(v, k){ if(done.has(k)) pend.delete(k); });
  var rt = new Set();
  S.ledger.forEach(function(doc){ Object.keys(doc.rt||{}).forEach(function(k){ if(doc.rt[k] > 0 && doc.memberId) rt.add(doc.memberId+'|'+k); }); });
  S.idx = {done:done, pend:pend, rt:rt, bal:bal};
}
function rateC(){ return Math.max(0, +(S.cfg && S.cfg.rate) || 0); }
function usd(stars){ return '$'+(stars * rateC() / 100).toFixed(2); }
function toggleRoutine(mid, cid){
  var c = S.chores.filter(function(x){ return x.id === cid; })[0]; if(!c) return;
  var now = new Date(), k = period(c, now)+'_'+c.id, docId = mid+'_'+mkey(now), doc = ledgerDoc(docId, mid);
  doc.rt[k] = S.idx.rt.has(mid+'|'+k) ? 0 : 1;
  saveLedger(docId, doc);
}
function partLabel(p){ return p === 'aft' ? 'After school' : p === 'pm' ? 'Bedtime' : 'Morning'; }
var ROUTINE_IDEAS = ['Brush teeth','Get dressed','Wash hands','Pack backpack','Put on pajamas','Read a book','Wash face','Shoes on'];
function routineHtml(m, today){
  var items = sortBy(S.chores.filter(function(c){ return c.routine && (c.memberIds||[]).indexOf(m.id) > -1 && applies(c, today, m.id); }), function(c){ return (c.order||0)+'|'+c.title; });
  if(!items.length) return '';
  return '<div class="rts">'+[['am','Morning'],['aft','After school'],['pm','Bedtime']].map(function(g){
    var l = items.filter(function(c){ return (c.part || 'am') === g[0]; });
    if(!l.length) return '';
    return '<div class="rt-g"><span class="rt-h">'+g[1]+'</span>'+l.map(function(c){

      return '<button class="rt'+(done ? ' done' : '')+'" role="checkbox" aria-checked="'+done+'" data-act="toggleRt" data-m="'+m.id+'" data-c="'+c.id+'">'+(iconOf(c) ? '<span class="rt-i" aria-hidden="true">'+iconOf(c)+'</span>' : '')+'<span class="rt-n">'+esc(c.title)+'</span><span class="rt-c"><svg class="ic s"><use href="#i-check"/></svg></span></button>';
    }).join('')+'</div>';
  }).join('')+'</div>';
}
function say(text){
  try { var u = new SpeechSynthesisUtterance(text); u.rate = .85; speechSynthesis.cancel(); speechSynthesis.speak(u); return true; }
  catch(e){ toast('This screen cannot read aloud'); return false; }
}
function sayLeft(mid){
  var m = S.members.filter(function(x){ return x.id === mid; })[0]; if(!m) return;
  var now = new Date(), h = now.getHours(), part = h < 11 ? 'am' : h < 17 ? 'aft' : 'pm', left = [];
  S.chores.forEach(function(c){
    if((c.memberIds||[]).indexOf(mid) < 0 || !applies(c, now, mid)) return;
    if(c.routine){ if((c.part || 'am') === part && !S.idx.rt.has(mid+'|'+period(c, now)+'_'+c.id)) left.push(c.title); }
    else if(!S.idx.done.has(mid+'|'+period(c, now)+'_'+c.id)) left.push(c.title);
  });
  say(left.length ? m.name+', here is what is left. '+left.join('. ')+'.' : m.name+', you are all done. Great job!');
}
var bonusSent = {};
function checkBonus(){
  var N = Math.max(0, +(S.cfg && S.cfg.bonusDays) || 0), B = Math.max(0, +(S.cfg && S.cfg.bonusStars) || 0);
  if(!S.ready || !N || !B) return;
  var today = new Date(), k = dkey(today)+'_bonus';
  S.members.forEach(function(m){
    var has = S.idx.done.get(m.id+'|'+k), want = 0;
    if(dailyList(m, today).length && dayComplete(m, today)){ var st = streak(m); if(st > 0 && st % N === 0) want = B; }
    if((has ? has.stars : 0) === want) return;
    var sk = m.id+'|'+k+'|'+want; if(bonusSent[m.id+'|'+k] === sk) return;
    bonusSent[m.id+'|'+k] = sk;
    var docId = m.id+'_'+mkey(today), d = ledgerDoc(docId, m.id); d.done[k] = want; saveLedger(docId, d);
    if(want) toast(m.name+' got a '+want+' star bonus for '+N+' days in a row!');
  });
}
function parentOK(){ return Date.now() < S.parentUntil; }
function balance(mid){ return S.idx.bal[mid] || 0; }
function ledgerDoc(docId, mid){
  var ex = S.ledger.filter(function(d){ return d.id === docId; })[0];
  var d = ex ? clone(ex) : {memberId:mid, month:docId.slice(-7), done:{}, spent:{}, pend:{}};
  delete d.id; d.done = d.done || {}; d.spent = d.spent || {}; d.pend = d.pend || {}; d.rt = d.rt || {};
  return d;
}
function saveLedger(docId, doc){ return S.store.set('ledger', docId, doc); }

function toggleChore(mid, cid){
  var c = S.chores.filter(function(x){ return x.id === cid; })[0]; if(!c) return;
  var now = new Date(), k = period(c, now)+'_'+c.id;
  var cur = S.idx.done.get(mid+'|'+k);
  var mem = S.members.filter(function(x){ return x.id === mid; })[0];
  var apv = !!(S.cfg && S.cfg.approve) && !parentOK();
  if(cur && apv){ toast('Ask a grown-up to undo that'); return; }
  var pnd = S.idx.pend.get(mid+'|'+k);
  if(!cur && pnd){ var pd = ledgerDoc(pnd.docId, mid); pd.pend[k] = 0; saveLedger(pnd.docId, pd); renderAll(); return; }
  if(!cur && apv){
    var pid = mid+'_'+mkey(now), p2 = ledgerDoc(pid, mid); p2.pend[k] = c.stars || 1; saveLedger(pid, p2);
    S.pop = {key:mid+'|'+cid, n:0}; setTimeout(function(){ S.pop = null; renderChores(); }, 600);
    toast('Sent to a grown-up to check'); renderAll(); return;
  }
  if(cur){
    var doc = ledgerDoc(cur.docId, mid); doc.done[k] = 0; saveLedger(cur.docId, doc);
    if(S.cel && S.cel.mid === mid) S.cel = null;
  } else {
    var before = mem ? dayComplete(mem, now) : true;
    var docId = mid+'_'+mkey(now), d2 = ledgerDoc(docId, mid);
    d2.done[k] = c.stars || 1; saveLedger(docId, d2);
    S.pop = {key:mid+'|'+cid, n:c.stars || 1};
    setTimeout(function(){ S.pop = null; renderChores(); }, 950);
    if(mem && !c.weekly && !before){
      var l = dailyList(mem, now), today = dkey(now);
      if(l.length && l.every(function(x){ return x.id === c.id || S.idx.done.has(mid+'|'+today+'_'+x.id); })){
        var token = {mid:mid};
        S.cel = token;
        setTimeout(function(){ if(S.cel === token){ S.cel = null; renderChores(); } }, 3600);
      }
    }
  }
  renderAll();
}
function redeem(mid, rid){
  var r = S.rewards.filter(function(x){ return x.id === rid; })[0]; if(!r) return;
  if(balance(mid) < r.cost){ toast('Not enough stars yet'); return; }
  var docId = mid+'_'+mkey(new Date()), doc = ledgerDoc(docId, mid), key = uid();
  doc.spent[key] = {cost:r.cost, title:r.title, at:Date.now()};
  saveLedger(docId, doc);
  S.undo = {docId:docId, key:key, mid:mid};
  S.ui.confirm = null; renderOverlay(true);
  toast('Cashed in: '+r.title, 'Undo');
}
function undoRedeem(){
  var u = S.undo; if(!u) return;
  var doc = ledgerDoc(u.docId, u.mid); delete doc.spent[u.key]; saveLedger(u.docId, doc);
  S.undo = null; $('#toast').hidden = true;
}
/* Reset today: undo what was checked off (or cashed in) today. Items and earlier days are never touched. */
function todayKeys(mid, routine){
  var now = new Date(), out = [];
  S.chores.forEach(function(c){
    if(!!c.routine !== routine || (c.memberIds||[]).indexOf(mid) < 0) return;
    var k = period(c, now)+'_'+c.id;
    if(routine){
      S.ledger.forEach(function(doc){ if(doc.memberId === mid && doc.rt && doc.rt[k] > 0) out.push({docId:doc.id, field:'rt', k:k}); });
    } else {
      var cur = S.idx.done.get(mid+'|'+k), pnd = S.idx.pend.get(mid+'|'+k);
      if(cur) out.push({docId:cur.docId, field:'done', k:k});
      if(pnd) out.push({docId:pnd.docId, field:'pend', k:k});
    }
  });
  if(!routine){
    var bk = dkey(now)+'_bonus', bn = S.idx.done.get(mid+'|'+bk);
    if(bn) out.push({docId:bn.docId, field:'done', k:bk, bonus:true});
  }
  return out;
}
function doResetToday(mid, routine){
  var list = todayKeys(mid, routine), docs = {}, n = 0;
  var mem = S.members.filter(function(x){ return x.id === mid; })[0];
  list.forEach(function(x){
    var d = docs[x.docId] || (docs[x.docId] = ledgerDoc(x.docId, mid));
    d[x.field][x.k] = 0;
    if(!x.bonus) n++;
  });
  Object.keys(docs).forEach(function(id){ saveLedger(id, docs[id]); });
  renderOverlay(true); renderAll();
  toast(n ? 'Reset today for '+(mem ? mem.name : 'them')+': '+n+' undone' : 'Nothing to reset today');
}
function todayCashIns(){
  var t = dkey(new Date()), out = [];
  S.ledger.forEach(function(doc){
    Object.keys(doc.spent||{}).forEach(function(k){
      var sp = doc.spent[k];
      if(!sp || !(sp.cost > 0) || dkey(new Date(sp.at || 0)) !== t) return;
      if(sp.title === 'Adjustment' || sp.title === 'Bonus' || /^Allowance paid/.test(sp.title || '')) return;
      out.push({docId:doc.id, mid:doc.memberId, k:k});
    });
  });
  return out;
}
function doResetCashIns(){
  var list = todayCashIns(), docs = {};
  list.forEach(function(x){
    var d = docs[x.docId] || (docs[x.docId] = ledgerDoc(x.docId, x.mid));
    delete d.spent[x.k];
  });
  Object.keys(docs).forEach(function(id){ saveLedger(id, docs[id]); });
  renderOverlay(true); renderAll();
  toast(list.length ? 'Gave back the stars for '+list.length+' reward'+(list.length === 1 ? '' : 's') : 'Nothing to reset today');
}
function adjustStars(mid, n){
  var docId = mid+'_'+mkey(new Date()), doc = ledgerDoc(docId, mid);
  doc.spent[uid()] = {cost:-n, title:n>0 ? 'Bonus' : 'Adjustment', at:Date.now()};
  saveLedger(docId, doc);
}

/* ---------- stats: day stars, streaks, weekly totals ---------- */
/* Only daily chores decide a day star. Once-a-week chores are a bonus. */
function dailyList(m, d){
  return S.chores.filter(function(c){ return !c.routine && !c.weekly && (c.memberIds||[]).indexOf(m.id) > -1 && applies(c, d, m.id); });
}
function dayComplete(m, d){
  var l = dailyList(m, d); if(!l.length) return false;
  var p = dkey(d);
  return l.every(function(c){ return S.idx.done.has(m.id+'|'+p+'_'+c.id); });
}
function streak(m){
  var d = new Date(), n = 0;
  for(var i = 0; i < 400; i++){
    if(dailyList(m, d).length){
      if(dayComplete(m, d)) n++;
      else if(i > 0) break;
    }
    d = addDays(d, -1);
  }
  return n;
}
function weekStars(mid){
  var ws = weekStart(new Date()), a = dkey(ws), b = dkey(addDays(ws, 6)), t = 0;
  S.idx.done.forEach(function(v, k){
    if(k.indexOf(mid+'|') !== 0) return;
    var p = k.slice(mid.length+1); if(p.charAt(0) === 'W') p = p.slice(1);
    p = p.slice(0, 10);
    if(p >= a && p <= b) t += v.stars;
  });
  return t;
}
function dayBadges(d, todayK){
  if(dkey(d) > todayK) return '';
  var out = sortBy(S.members, function(m){ return (m.order||0)+'|'+m.name; }).filter(function(m){ return dayComplete(m, d); }).map(function(m){
    return '<span class="sb" style="--mc:'+m.color+'" title="'+esc(m.name)+' finished all chores"><svg class="ic"><use href="#i-star"/></svg><b>'+esc(initial(m.name))+'</b></span>';
  }).join('');
  return out ? '<div class="sbs">'+out+'</div>' : '';
}

/* ---------- render: calendar ---------- */
function viewMonth(){ var d = new Date(); return new Date(d.getFullYear(), d.getMonth() + S.ui.monthOffset, 1); }
function dayItems(dk){
  return S.view.map(function(e, n){ return {e:e, n:n}; }).filter(function(o){
    return o.e.allDay ? (o.e.sk <= dk && dk < o.e.ek) : o.e.sk === dk;
  }).sort(function(a, b){
    if(a.e.allDay !== b.e.allDay) return a.e.allDay ? -1 : 1;
    return a.e.allDay ? 0 : a.e.st - b.e.st;
  });
}
function calHead(title, sub){

  return '<div class="cal-head"><h2>'+esc(title)+(sub ? '<small>'+esc(sub)+'</small>' : '')+'</h2>'

    + '<button class="seg-b'+(!wk ? ' on' : '')+'" role="tab" aria-selected="'+(!wk)+'" data-act="calMode" data-v="month">Month</button></div>'
    + (S.ready ? '<button class="btn sm primary" data-act="newEvent">+ Event</button>' : '')
    + (off !== 0 ? '<button class="btn sm" data-act="calToday">Today</button>' : '')
    + '<button class="btn nav" data-act="calPrev" aria-label="Previous"><svg class="ic s"><use href="#i-left"/></svg></button>'
    + '<button class="btn nav" data-act="calNext" aria-label="Next"><svg class="ic s"><use href="#i-right"/></svg></button>'
    + '<button class="btn nav" data-act="closeCal" aria-label="Close calendar"><svg class="ic s"><use href="#i-x"/></svg></button></div>';
}
function legendHtml(){
  var legItems = sortBy(S.members, function(m){ return (m.order||0)+'|'+m.name; }).map(function(m){ return '<span><i style="--c:'+m.color+'"></i>'+esc(m.name)+'</span>'; });
  if(S.chores.length && S.members.length) legItems.push('<span><svg class="ic star"><use href="#i-star"/></svg>Initial star = finished all chores</span>');

function renderMonth(el){
  var first = viewMonth(), gs = weekStart(first), dim = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
  var rows = Math.ceil((((first.getDay()+6)%7) + dim) / 7), ge = addDays(gs, rows*7 - 1);
  var head = calHead(first.toLocaleDateString([], {month:'long', year:'numeric'}), '');
  if(!S.ready){ setHtml(el, head + '<div class="calmsg">Loading calendar...</div>'); return; }
  S.view = localEvs(gs, ge);
  var todayK = dkey(new Date()), mm = {}; S.meals.forEach(function(x){ mm[x.id] = x; });
  var dows = [1,2,3,4,5,6,0].map(function(d){ return '<div class="mh">'+DAYS[d]+'</div>'; }).join('');

  for(var i = 0; i < rows*7; i++){
    var d = addDays(gs, i), dk = dkey(d), items = dayItems(dk);
    var cls = (dk === todayK ? ' today' : dk < todayK ? ' past' : '') + (d.getMonth() !== first.getMonth() ? ' out' : '');

      var e = o.e;
      return '<button class="mev'+(e.allDay ? ' all' : '')+'" style="--c:'+e.color+'" data-act="event" data-i="'+o.n+'">'+(e.allDay ? '' : '<b>'+fmtTime(e.st).replace(':00','').replace(' ','').toLowerCase()+'</b> ')+esc(e.title)+'</button>';
    }).join('');
    var more = items.length > 2 ? '<span class="mmore">+'+(items.length - 2)+' more</span>' : '';
    var dots = items.slice(0, 5).map(function(o){ return '<i style="--c:'+o.e.color+'"></i>'; }).join('');
    var ml = mm[dk];
    cells += '<div class="mday'+cls+'" role="button" tabindex="0" data-act="day" data-d="'+dk+'" aria-label="'+esc(DAY_LONG[d.getDay()]+' '+d.toLocaleDateString([], {month:'long', day:'numeric'}))+'">'
      + '<div class="mtop"><span class="mnum">'+d.getDate()+'</span>'+dayBadges(d, todayK)+'</div>'
      + '<div class="mevs">'+pills+more+'</div><div class="mdots">'+dots+'</div>'
      + (ml && ml.dinner ? '<div class="mmeal">'+esc(ml.dinner)+'</div>' : '')
      + '</div>';
  }
  setHtml(el, head + '<div class="month" style="grid-template-rows:auto repeat('+rows+',minmax(0,1fr))">'+dows+cells+'</div>' + legendHtml());

/* ---------- render: calendar ---------- */

  if(c === 0) return 'Clear'; if(c <= 2) return 'Partly cloudy'; if(c === 3) return 'Cloudy'; if(c === 45 || c === 48) return 'Fog';
  if(c >= 51 && c <= 57) return 'Drizzle'; if(c >= 61 && c <= 67) return 'Rain'; if(c >= 71 && c <= 77) return 'Snow';
  if(c >= 80 && c <= 82) return 'Showers'; if(c === 85 || c === 86) return 'Snow showers'; if(c >= 95) return 'Thunderstorms'; return '';

  if(code >= 71 && code <= 86) p.push('boots'); else if(pop >= 50) p.push('rain gear');

function startTimer(min, name){
  min = Math.max(0.1, Math.min(600, +min || 0)); if(!min) return;
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if(AC.resume) AC.resume(); } catch(e){}
  S.timers.push({id:uid(), end:Date.now() + min*60000, name:(name || '').trim() || 'Timer', min:min}); saveTimers(); renderTmrs(); closeOv();

  } catch(e){}

function checkReminders(){

  try { var raw = JSON.parse(localStorage.getItem('kb-rem') || 'null'); if(raw && raw.d === dk) st = raw; } catch(e){}

    var r = l[i], tm = parseInt(r.t.slice(0,2), 10)*60 + parseInt(r.t.slice(3,5), 10), id = r.t+'|'+r.text;

function shrink(file){
  return createImageBitmap(file).then(function(bm){
    var sc = Math.min(1, 1600 / Math.max(bm.width, bm.height)), c = document.createElement('canvas');
    c.width = Math.round(bm.width * sc); c.height = Math.round(bm.height * sc); c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.78);

function mkOcc(d, dk){
  var m = S.members.filter(function(x){ return x.id === d.who; })[0];
  var base = {id:d.id, local:true, title:d.title || '(No title)', color:(m ? m.color : 'var(--accent)'), location:d.loc || '', who:d.who || '', rep:d.rep || '', until:d.until || '', occ:dk};

function repHit(d, day){
  var s = parseKey(d.sd), r = d.rep;
  if(day < s) return false;
  if(r === 'daily') return true;
  if(r === 'weekdays') return day.getDay() > 0 && day.getDay() < 6;
  if(r === 'weekly') return day.getDay() === s.getDay();
  if(r === 'monthly') return day.getDate() === s.getDate();

function localEvs(a, b){

  S.events.forEach(function(d){
    if(!d.sd) return;
    if(!d.rep){ var o = mkOcc(d, d.sd); if(o) out.push(o); return; }
    var span = Math.max(0, Math.round((parseKey(d.ed || d.sd) - parseKey(d.sd)) / 864e5));
    var skip = d.skip || [];
    for(var day = addDays(a, -span); dkey(day) <= bk; day = addDays(day, 1)){

  fAllDay:function(){ if(S.ui.form){ S.ui.form.allDay = !S.ui.form.allDay; renderOverlay(true); } },

  rewardAsk:function(t){ S.ui.confirm = {m:S.ui.rm, r:t.dataset.id}; renderOverlay(true); },

  color:function(t){ var m = S.members.filter(function(x){ return x.id === t.dataset.id; })[0]; if(!m) return; var n = stripId(m); n.color = t.dataset.c; S.store.set('members', m.id, n); renderOverlay(true); },
  adjust:function(t){ adjustStars(t.dataset.id, +t.dataset.n); toast((+t.dataset.n > 0 ? 'Added' : 'Removed')+' one star'); },
  addChore:function(){ addChore(); },
  quickChore:function(t){ addChore(t.dataset.t); },
  editChore:function(t){ S.ui.editChore = S.ui.editChore === t.dataset.id ? null : t.dataset.id; renderOverlay(true); },
  choreWho:function(t){ patchChore(t.dataset.id, function(n){ var a = n.memberIds || [], i = a.indexOf(t.dataset.m); if(i > -1) a.splice(i, 1); else a.push(t.dataset.m); n.memberIds = a; }); renderOverlay(true); },
  choreMode:function(t){ patchChore(t.dataset.id, function(n){ n.weekly = t.dataset.v === 'weekly'; if(!n.days || !n.days.length) n.days = [0,1,2,3,4,5,6]; }); renderOverlay(true); },
  choreDay:function(t){ patchChore(t.dataset.id, function(n){ var d = +t.dataset.d, a = n.days && n.days.length ? n.days : [0,1,2,3,4,5,6], i = a.indexOf(d); if(i > -1){ if(a.length > 1) a.splice(i, 1); } else a.push(d); n.days = a; }); renderOverlay(true); },
  choreStep:function(t){ patchChore(t.dataset.id, function(n){ n.stars = Math.max(1, Math.min(20, (n.stars || 1) + (+t.dataset.d))); }); renderOverlay(true); },
  choreStars:function(t){ patchChore(t.dataset.id, function(n){ n.stars = +t.dataset.n; }); renderOverlay(true); },
  delChore:function(t){ arm('c'+t.dataset.id, function(){ S.store.del('chores', t.dataset.id); S.ui.editChore = null; }); },
  addReward:addReward,
  quickReward:function(t){ S.store.set('rewards', uid(), {title:t.dataset.t, cost:+t.dataset.n}); renderOverlay(true); },
  delReward:function(t){ arm('r'+t.dataset.id, function(){ S.store.del('rewards', t.dataset.id); }); },
  resetToday:function(t){ var mid = S.ui.choreFor, rt = t.dataset.kind === 'routine'; arm('reset-'+t.dataset.kind+mid, function(){ doResetToday(mid, rt); }); },
  resetCashIns:function(){ arm('reset-rewards', function(){ doResetCashIns(); }); },
  undo:undoRedeem
};
var CHG = {
  cfgFrom:function(t){ if(t.value) setCfg({from:t.value}); },

  photos:function(t){ addPhotos(t.files); },
  mname:function(t){ var m = S.members.filter(function(x){ return x.id === t.dataset.id; })[0]; var v = t.value.trim(); if(!m || !v) { t.value = m ? m.name : ''; return; } var n = stripId(m); n.name = v; S.store.set('members', m.id, n); },
  ctitle:function(t){ var v = t.value.trim(); if(v) patchChore(t.dataset.id, function(n){ n.title = v; }); },
  rtitle:function(t){ var r = S.rewards.filter(function(x){ return x.id === t.dataset.id; })[0]; var v = t.value.trim(); if(!r || !v) return; var n = stripId(r); n.title = v; S.store.set('rewards', r.id, n); },
  rcost:function(t){ var r = S.rewards.filter(function(x){ return x.id === t.dataset.id; })[0]; var v = Math.max(1, parseInt(t.value, 10) || 0); if(!r) return; var n = stripId(r); n.cost = v; S.store.set('rewards', r.id, n); }
};

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]');
  if(t){ var f = H[t.dataset.act]; if(f) f(t, e); return; }
  if(e.target.id === 'scrim') closeOv();
});
document.addEventListener('change', function(e){ var t = e.target, f = t.dataset && CHG[t.dataset.chg]; if(f) f(t); });
document.addEventListener('input', function(e){
  var t = e.target, k = t.dataset && t.dataset.f, f = S.ui.form;
  if(t.id === 'bk') S.ui.bk = t.value;
  if(!k || !f) return;
  f[k] = t.value;
  if(k === 'sd' && t.value && (!f.ed || f.ed < t.value)){ f.ed = t.value; var ed = $('#f-ed'); if(ed) ed.value = t.value; }
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && S.ui.overlay) closeOv();
  if(e.key === 'Enter' && e.target.dataset && e.target.dataset.enter){ e.preventDefault(); var f = H[e.target.dataset.enter]; if(f) f(e.target); }
});
var lastAct = Date.now();
document.addEventListener('pointerdown', function(e){
  lastAct = Date.now();
  if(PH.on){ hideSaver(); e.stopPropagation(); e.preventDefault(); return; }
  ptrDown = true; lastTouch = Date.now();
}, true);
document.addEventListener('keydown', function(){ lastAct = Date.now(); if(PH.on) hideSaver(); }, true);
['pointerup','pointercancel'].forEach(function(n){ document.addEventListener(n, function(){ ptrDown = false; flushOv(); }, true); });
document.addEventListener('focusout', flushOv);

/* hold the gear to open setup, so small hands do not wander in */
var gear = $('#gear'), holdT = null;
gear.addEventListener('pointerdown', function(){
  gear.classList.add('holding');
  holdT = setTimeout(function(){ holdT = null; gear.classList.remove('holding'); openOv('setup', 'family'); }, 650);
});
['pointerup','pointerleave','pointercancel'].forEach(function(n){
  gear.addEventListener(n, function(){
    if(holdT){ clearTimeout(holdT); holdT = null; if(n === 'pointerup') toast('Hold the gear to open setup'); }
    gear.classList.remove('holding');
  });
});
gear.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openOv('setup', 'family'); } });
gear.addEventListener('contextmenu', function(e){ e.preventDefault(); });

/* ---------- clock, day rollover, wake lock ---------- */
function tick(){
  var d = new Date(), h = d.getHours()%12 || 12;
  if(S.ready && S.cfg && S.cfg.wx) loadWx();
  $('#clk').textContent = h+':'+pad(d.getMinutes());
  $('#ampm').textContent = d.getHours() < 12 ? 'AM' : 'PM';
  $('#datestr').textContent = d.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'});
  var k = dkey(d);
  if(lastDay && k !== lastDay){ lastDay = k; renderAll(); }
  lastDay = k;
  applyDisplay();
  checkTimers(); checkReminders();
  if(PH.on) svClock();
  var sm = saverMins(); if(sm && PH.list.length && !PH.on && !S.alarm && !S.ui.overlay && Date.now() - lastAct > sm*60000) showSaver();
  /* kiosk: after two quiet minutes, go back to this week and close the read-only sheets */
  if(Date.now() - lastTouch > 120000){
    var quiet = ['rewards','groceries','event','meal','day','notes','tomorrow'].indexOf(S.ui.overlay) > -1;
    if(document.body.classList.contains('calopen')){ document.body.classList.remove('calopen'); if(!quiet) renderAll(); }
    if(S.ui.weekOffset !== 0 || S.ui.monthOffset !== 0 || S.ui.calMode !== 'week' || quiet){ S.ui.weekOffset = 0; S.ui.monthOffset = 0; S.ui.calMode = 'week'; if(quiet) closeOv(); renderAll(); }
    lastTouch = Date.now();
  }
}
var wake = null;
var APP = /KitchenBoardApp/.test(navigator.userAgent);
/* wall screens stay awake by default; on a phone it is opt-in so the battery is left alone */
function awakeOn(){ var c = S.cfg || {}; if(c.awake !== undefined) return !!c.awake; return APP ? !!(window.KBApp && KBApp.isLarge()) : true; }
function keepAwake(){
  try {
    if(window.KBApp){ KBApp.keepAwake(awakeOn()); return; }
    if(!awakeOn()){ if(wake){ wake.release(); wake = null; } return; }
    if(navigator.wakeLock && !document.hidden && !wake) navigator.wakeLock.request('screen').then(function(l){ wake = l; l.addEventListener('release', function(){ if(wake === l) wake = null; }); }).catch(function(){});
  } catch(e){}
}
document.addEventListener('visibilitychange', function(){
  if(document.hidden) return;
  keepAwake(); tick();
});

/* Android app: the hardware Back button closes an open sheet first */
window.__back = function(){ if(S.ui.overlay){ closeOv(); return true; } return false; };

/* ---------- start ---------- */
function use(n){
  if(!window.claude || !window.claude.use) return Promise.resolve(null);
  return window.claude.use(n).catch(function(){ return null; });
}
/* Docker/self-hosted: a small Node server keeps the same collections in a JSON file */
function probeServer(){
  if(!window.fetch || location.protocol === 'file:') return Promise.resolve(null);
  return fetch('/api/state', {cache:'no-cache'}).then(function(r){ if(!r.ok) throw new Error('state'); return r.json(); })
    .then(function(j){ return (j && typeof j.rev === 'number' && j.data) ? j : null; })
    .catch(function(){ return null; });
}
function serverStore(initial){
  var data = initial.data || {}, rev = initial.rev, subs = {}, tail = Promise.resolve(), pending = 0;
  function docs(c){ var o = data[c] || {}; return Object.keys(o).map(function(id){ var d = clone(o[id]); d.id = id; return d; }); }
  function emit(){ Object.keys(subs).forEach(function(c){ subs[c].forEach(function(f){ f(docs(c)); }); }); }
  function pull(){
    return fetch('/api/state', {cache:'no-cache'}).then(function(r){ if(!r.ok) throw new Error('state'); return r.json(); }).then(function(j){
      var was = S.dberr; S.dberr = '';
      if(j.rev !== rev){ rev = j.rev; data = j.data || {}; emit(); } else if(was){ renderAll(); }
    }).catch(function(){ if(!S.dberr){ S.dberr = 'offline'; renderAll(); } });
  }
  function write(method, c, id, body){
    pending++;
    tail = tail.then(function(){
      return fetch('/api/'+c+'/'+encodeURIComponent(id), {method:method, headers:{'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined})
        .then(function(r){ if(!r.ok) throw new Error('write'); });
    }).catch(function(){ rev = -1; toast('Could not save that. Try again.'); })
      .then(function(){ pending--; return pending === 0 ? pull() : null; });
    return tail;
  }
  setInterval(function(){ if(!document.hidden && pending === 0) pull(); }, 4000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && pending === 0) pull(); });
  return {
    kind:'server',
    subscribe:function(c, cb){
      (subs[c] = subs[c] || []).push(cb);
      Promise.resolve().then(function(){ cb(docs(c)); });
      return function(){ subs[c] = (subs[c] || []).filter(function(f){ return f !== cb; }); };
    },
    set:function(c, id, v){ (data[c] = data[c] || {})[id] = clone(v); emit(); return write('PUT', c, id, v); },
    del:function(c, id){ if(data[c]) delete data[c][id]; emit(); return write('DELETE', c, id); }
  };
}
function boot(){
  applyZoom(); loadTimers(); loadPhotos(); tick(); setInterval(tick, 1000); keepAwake(); renderAll();
  use('db').then(function(d){
    db = d;
    if(db) return dbStore(db);
    return probeServer().then(function(j){ return j ? serverStore(j) : localStore(); });
  }).then(function(store){
    S.store = store; S.storeKind = store.kind; S.ready = true;
    S.store.subscribe('members', function(a){ S.members = a; renderAll(); });
    S.store.subscribe('chores', function(a){ S.chores = a; renderAll(); });
    S.store.subscribe('rewards', function(a){ S.rewards = a; renderAll(); });
    S.store.subscribe('events', function(a){ S.events = a; renderAll(); });
    S.store.subscribe('ledger', function(a){ S.ledger = a; rebuildIdx(); renderAll(); });
    S.store.subscribe('meals', function(a){ S.meals = a; renderAll(); });
    S.store.subscribe('groceries', function(a){ S.groceries = a; renderAll(); });
    S.store.subscribe('notes', function(a){ S.notes = a; renderAll(); });
    S.store.subscribe('config', function(a){ S.goal = a.filter(function(x){ return x.id === 'goal'; })[0] || null; S.cfg = a.filter(function(x){ return x.id === 'display'; })[0] || {}; applyDisplay(); keepAwake(); loadWx(); renderAll(); });
    renderAll();
  });
}

boot();
})();
